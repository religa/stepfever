<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background gradient -->
  <rect width="1920" height="1080" fill="url(#bg-gradient)"/>

  <!-- Glow effects -->
  <circle cx="300" cy="200" r="400" fill="url(#glow)"/>
  <circle cx="1620" cy="880" r="500" fill="url(#glow)"/>

  <!-- Abstract rhythm lines -->
  <g opacity="0.15" stroke="#e94560" stroke-width="3" fill="none">
    <path d="M 0 540 Q 240 400, 480 540 T 960 540 T 1440 540 T 1920 540"/>
    <path d="M 0 440 Q 240 300, 480 440 T 960 440 T 1440 440 T 1920 440"/>
    <path d="M 0 640 Q 240 500, 480 640 T 960 640 T 1440 640 T 1920 640"/>
  </g>

  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="0" x2="1920" y2="1080"/>
    <line x1="1920" y1="0" x2="0" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
  </g>

  <!-- Beat indicators -->
  <g opacity="0.2" fill="#e94560">
    <circle cx="200" cy="540" r="8"/>
    <circle cx="480" cy="540" r="8"/>
    <circle cx="760" cy="540" r="8"/>
    <circle cx="1040" cy="540" r="8"/>
    <circle cx="1320" cy="540" r="8"/>
    <circle cx="1600" cy="540" r="8"/>
    <circle cx="1880" cy="540" r="8"/>
  </g>
</svg>
