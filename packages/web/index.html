<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StepFever - A Modern Rhythm Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #1a1a2e;
      --bg-image: none;
      --bg-overlay-opacity: 0;
    }

    body {
      font-family: 'Courier New', monospace;
      background-color: var(--bg-color);
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: #eee;
      overflow: hidden;
    }

    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #app::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, var(--bg-overlay-opacity));
      pointer-events: none;
      z-index: 0;
    }

    #app > * {
      position: relative;
      z-index: 1;
    }

    /* Loading screen */
    .loading {
      text-align: center;
    }

    .loading h1 {
      font-size: 3rem;
      background: linear-gradient(45deg, #00f5ff, #ff00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    /* Component styles are in screens.css */
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">
      <h1>StepFever</h1>
      <p>Loading...</p>
    </div>
  </div>
  <script type="module" src="/src/app.ts"></script>
</body>
</html>
